plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.spotify_pojav.bridge'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.spotify_pojav.bridge'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    // Keep Java and Kotlin bytecode targets aligned with the JDK used by CI.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}
